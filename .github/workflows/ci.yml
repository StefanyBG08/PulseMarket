
name: Pruebas y CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulsemarket_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulsemarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pulsemarket_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      PYTHONPATH: .

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Instalar navegador para E2E
        run: python -m playwright install --with-deps chromium

      - name: Verificar archivos del proyecto
        run: |
          ls -la
          ls -la tests
          python -c "import app; print('app.py encontrado correctamente')"

      - name: Ejecutar pruebas unitarias
        run: python -m pytest -q tests/test_app.py

      - name: Iniciar Flask para las pruebas E2E
        run: |
          python -c "from app import inicializar_db; inicializar_db(); from app import app; app.run(host='127.0.0.1', port=5000)" > /tmp/pulsemarket.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask está listo."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/pulsemarket.log
          exit 1

      - name: Ejecutar pruebas E2E
        run: python -m pytest -q tests/e2e
